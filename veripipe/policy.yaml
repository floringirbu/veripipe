# VeriPipe gateway policy. Hot-reloaded on change; every ledger receipt records
# the `version` below plus the SHA-256 of this file.
version: "2026.11.0"

# Enables the demo-only endpoints (ledger tamper / restore / reset). Set false in production.
demo_mode: true

upstream:
  # mock   -> built-in Mock LLM, no API key or network needed (default)
  # openai -> real pass-through; needs OPENAI_API_KEY (or the client's Authorization header)
  # Override without editing this file: VERIPIPE_UPSTREAM_MODE=openai
  mode: mock
  openai_base_url: https://api.openai.com/v1
  timeout_seconds: 30

pii:
  enabled: true
  detectors: [EMAIL, IBAN, CREDIT_CARD, SSN, PPSN, PHONE]

circuit_breaker:
  # Matched case-insensitively after collapsing punctuation/whitespace.
  blocked_phrases:
    - ignore previous instructions
    - ignore all previous instructions
    - ignore the above instructions
    - disregard previous instructions
    - forget your instructions
    - reveal your system prompt
    - print your system prompt
    - dump database
    - dump the database
    - drop table
    - you are now dan
    - developer mode enabled
  max_prompt_tokens: 2000        # estimated, ~4 chars per token
  max_completion_tokens: 1024    # ceiling for the request's max_tokens
  default_completion_tokens: 256 # assumed when the request sets no max_tokens
  max_estimated_cost_usd: 0.05   # per request

pricing:   # USD per 1K tokens, used for the cost rule
  default: {input_per_1k: 0.0025, output_per_1k: 0.01}
  models:
    gpt-4o:      {input_per_1k: 0.0025,  output_per_1k: 0.01}
    gpt-4o-mini: {input_per_1k: 0.00015, output_per_1k: 0.0006}
    o1:          {input_per_1k: 0.015,   output_per_1k: 0.06}

pr_agent:
  scan_target: sample-vulnerable-app
  gateway_url: http://localhost:8000/v1
